- order: "1"
  type: IntroCard
  size: x2-card
  onOff: "On"
  variant: trinity
  title: Learn more about me
  body: Munus Shih is a Taiwanese Minnan-Hakka creative coder, artist, educator, and organizer based in New York City. His work connects open-source software, collective publishing, teaching, and community infrastructure.
  link:
    href: https://meet.munusshih.com
  show: true
- order: "2"
  type: CustomCard
  onOff: "On"
  title: In Motion
  body: |-
    1. I'm developing [p5.book](https://p5-book.vercel.app/) and [p5.export](https://www.npmjs.com/package/@munusshih/p5.export), and updating [p5.zine](/work/p5-zine/). Together, these open-source projects explore how p5.js can support bookmaking, exporting sketches, and collective publishing.
    2. I'm documenting recent projects including Threading Memory, Noise in the Field, Contemporary Worker's Survival Guide, and Syllabus (Subject to Change). I want their collaborative process to be as visible as their final outcomes.
    3. I'm preparing to participate in [Solidarity AI](https://platform.coop/events/solidarity-ai/) at Chulalongkorn University in Bangkok, a conference focused on cooperative and community-governed AI, November 12 to 15, 2026.
  background: DeepSkyBlue
  textColor: black
  show: true
