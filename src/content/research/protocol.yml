title: protocol*
startDate: "2026"
tags: [Tools, Community]
description: >-
  A workspace for CoAssembly’s worker-owners. It brings project planning, proposals, time
  tracking, notes, and shared resources into one place to support the cooperative’s day-to-day
  work and collective decision-making. It is an internal project and development is ongoing.
