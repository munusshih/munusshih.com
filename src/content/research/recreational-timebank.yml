title: Recreational Timebank (Offline Branch)
startDate: November 25–28, 2025
backlog: true
tags: [Exhibition, Community]
description: >-
  An experimental bank at Beholding Cell in Taipei that treated leisure time as currency.
  Visitors were invited to consider how much time they set aside for rest and what they might
  share or exchange. Artists who make work alongside full-time jobs used the exhibition as
  a place for conversation and mutual learning.
credit: SpOnAcT!
