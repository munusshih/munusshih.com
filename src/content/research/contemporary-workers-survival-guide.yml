title: Contemporary Worker's Survival Guide
startDate: "2026"
tags: [Publishing, Community]
description: >-
  A publication about how contemporary creative workers sustain their practice under neoliberalism.
  CoAssembly drew on its first year of organizing as a design cooperative, using weekly
  conversations to reflect on labor conditions and collect what the group had learned. The guide is
  part of an ongoing series on labor issues in design.
credit: Co-authored with [CoAssembly](https://coassembly.work/).
