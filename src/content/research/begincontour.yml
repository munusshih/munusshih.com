title: beginContour 從等高線開始
startDate: December 2022
backlog: true
tags: [Education, Community]
description: >-
  A six-week teaching practicum exploring anti-colonial and intersectional approaches
  to creative technology education in Taiwan. The project brought teachers, artists,
  designers, and creative coders together for workshops and discussions, and supported
  participants in developing their own teaching tools and syllabi.
credit: Co-organized with Yenching Lu.
