title: Critical AI Potluck
startDate: April 11, 2026
tags: [Education, Community]
description: >-
  A peer-learning group for artists, designers, creative technologists, writers, researchers,
  and teachers who want to think critically about AI together. Participants bring their
  questions and experiences, shape the format together, and take turns hosting sessions.
  The project site collects notes and materials from those meetings.
credit: >-
  Aarushi Bapna, Avneesh Sarwate, Tanvi Sharma, Matt Martin, Arden Schager, Matias Piña Aguilera,
  and Munus Shih.
link: https://critical-potluck.fun/
linkLabel: View more
og: "[video] https://critical-potluck.fun/"
