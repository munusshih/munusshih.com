title: Syllabus (Subject to Change)
startDate: June 4–22, 2025
backlog: true
tags: [Exhibition, Education, Publishing]
description: >-
  A participatory installation that invites visitors to write a syllabus together by responding to
  prompts. A printer turns their contributions into a continuously growing changelog, making the
  revisions and exchanges that shape a collective curriculum visible.


  The installation was exhibited in *Embodied Algorithms / Collective Mechanics* at DEMO2025.
credit: Nikki Makagiansar, Franco Chen, and Em DeVincentis. Curated by Sheldon Gooch.
