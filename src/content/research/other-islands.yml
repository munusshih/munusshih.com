title: Other Islands Book Fair
startDate: April 25–26, 2026
tags: [Publishing, Community]
description: >-
  A public book fair organized by Pratt Graduate Communications Design. It brought independent
  publishers, designers, artists, and community organizers together at the Pfizer Building
  in Brooklyn for a weekend of publishing and exchange.
credit: Organized with Cristina Gabriele and Gaia Hwang. Photos by Harshvi Shah and Dahlia Dandashi.
link: https://otherislands.designfuture.space/
linkLabel: View more
