title: Noise in the Field
startDate: March 2026
backlog: true
tags: [Exhibition, Tools]
description: |-
  An exhibition at National Taiwan University that asked visitors to notice the noise they normally filter out. One work brought historical documents and scientific imagery together in layers of printed cloth and paper.

  In *Practicing Ecological Distance: Metal Stools*, live data feeds were translated into sound and subtle vibrations. Visitors could sit on the stools and feel activity at scales beyond their immediate surroundings.
credit: I-Hao Liao (curator) and no side here.
