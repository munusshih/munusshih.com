title: p5.zine
startDate: June 2022
tags: [Publishing, Tools]
description: >-
  An open-source p5.js library for making printable zines with code. p5.zine is a
  rewrite of p5.genzine, a tool Munus Shih and Iley Cao developed for remixing and
  collaborative zine-making. The original library was the basis of Munus’s 2023
  Parsons thesis, Zine as Coding Connectivity.
credit: Original p5.genzine by Munus Shih and Iley Cao.
link: https://github.com/munusshih/p5.zine
