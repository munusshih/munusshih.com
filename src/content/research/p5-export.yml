title: p5.export
startDate: May 2026
tags: [Tools]
description: >-
  A p5.js add-on for exporting sketches as still images, animations, video, vector graphics,
  PDFs, and 3D models. It works with p5.js 1.x and 2.x and offers both a JavaScript API and an
  optional panel for choosing formats and export settings inside a running sketch.
