title: p5.book
startDate: March 2026
tags: [Tools, Publishing]
description: >-
  A PDF book generator for p5.js 2.0. It captures each frame of a sketch as a page, compiles
  the pages into a PDF, and opens a viewer for previewing and exporting the book for print.
  The documentation and workshop show how to make everything from folded zines to generative
  books and portfolios.
